<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in | Bats AI</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='bats.jpg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body.theme-black {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--main-bg);
    }
    .login-page-card {
      width: 100%;
      max-width: 420px;
      background: var(--popup-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 14px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .auth-providers {
      display: grid;
      gap: 9px;
    }
    .auth-provider-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .auth-provider-btn i {
      width: 18px;
      font-size: 17px;
      text-align: center;
    }
    .auth-provider-btn .fa-google {
      color: #4285f4;
    }
    .auth-provider-btn .fa-facebook {
      color: #1877f2;
    }
    .auth-provider-btn:hover {
      background: var(--main-bg);
    }
  </style>
</head>
<body class="theme-black">
  <main class="login-page-card" aria-label="Account access">
    <div class="login-brand">
      <img class="brand-icon-img" src="{{ url_for('static', filename='bats.jpg') }}" alt="">
      <span>Bats AI</span>
    </div>
    <div class="auth-header"><h2>Welcome</h2></div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabSignInBtn" type="button" onclick="switchAuthTab('signin')">Sign in</button>
      <button class="auth-tab" id="tabSignUpBtn" type="button" onclick="switchAuthTab('signup')">Create account</button>
    </div>

    <div id="formSignIn">
      <input class="auth-input" id="loginEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="auth-input" id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button class="auth-primary-btn" type="button" onclick="handleSignIn()">Sign in</button>
    </div>

    <div id="formSignUp" style="display:none">
      <input class="auth-input" id="regName" placeholder="Full name" autocomplete="name">
      <input class="auth-input" id="regEmail" type="email" placeholder="Email" autocomplete="email">
      <input class="auth-input" id="regPassword" type="password" placeholder="Password" autocomplete="new-password">
      <button class="auth-primary-btn" type="button" onclick="handleSignUp()">Create account</button>
    </div>
    <div class="auth-alert" id="authAlert">{{ auth_error or '' }}</div>
    <div class="auth-divider"><span>Or continue with</span></div>
    <div class="auth-providers" aria-label="Social sign in">
      <a class="auth-provider-btn" href="{{ url_for('oauth_login', provider='google') }}"><i class="fa-brands fa-google" aria-hidden="true"></i>Continue with Google</a>
      <a class="auth-provider-btn" href="{{ url_for('oauth_login', provider='facebook') }}"><i class="fa-brands fa-facebook" aria-hidden="true"></i>Continue with Facebook</a>
      <a class="auth-provider-btn" href="{{ url_for('oauth_login', provider='github') }}"><i class="fa-brands fa-github" aria-hidden="true"></i>Continue with GitHub</a>
    </div>
  </main>

  <script>
    function switchAuthTab(tab) {
      document.getElementById('authAlert').innerText = '';
      const isSignIn = tab === 'signin';
      document.getElementById('tabSignInBtn').classList.toggle('active', isSignIn);
      document.getElementById('tabSignUpBtn').classList.toggle('active', !isSignIn);
      document.getElementById('formSignIn').style.display = isSignIn ? 'block' : 'none';
      document.getElementById('formSignUp').style.display = isSignIn ? 'none' : 'block';
    }

    async function handleSignIn() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const alertDiv = document.getElementById('authAlert');
      if (!email || !password) {
        alertDiv.innerText = 'Please fill in email and password.';
        return;
      }
      try {
        const res = await fetch('/api/signin', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (res.ok) window.location.href = '/';
        else alertDiv.innerText = data.error || 'Sign in failed.';
      } catch (error) {
        alertDiv.innerText = 'Network error signing in.';
      }
    }

    async function handleSignUp() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const alertDiv = document.getElementById('authAlert');
      if (!name || !email || !password) {
        alertDiv.innerText = 'All fields are required.';
        return;
      }
      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name, email, password})
        });
        const data = await res.json();
        if (res.ok) window.location.href = '/';
        else alertDiv.innerText = data.error || 'Account creation failed.';
      } catch (error) {
        alertDiv.innerText = 'Network error creating account.';
      }
    }
  </script>
</body>
</html>
